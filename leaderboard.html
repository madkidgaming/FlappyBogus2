<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Boguś 2 – Wyniki</title>
    <link rel="stylesheet" href="https://use.typekit.net/iad7nis.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #08080a;
            color: #d9d2c0;
            font-family: 'megascope-variable', 'Helvetica', sans-serif;
            font-variation-settings: "wght" 700, "SCOP" 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 60px;
        }

        header {
            text-align: center;
            margin-bottom: 36px;
        }

        header h1 {
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 900;
            color: #d85a1e;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        header p {
            margin-top: 8px;
            font-size: 14px;
            color: #b0b0b0;
            letter-spacing: 1px;
        }

        /* ─── Tabela ─────────────────────────────────── */
        .board {
            width: 100%;
            max-width: 480px;
        }

        .board-row {
            display: grid;
            grid-template-columns: 48px 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid #1e1e22;
            transition: background 0.15s;
        }

        .board-row:hover { background: #0f0f12; }

        /* Top 3 */
        .board-row.rank-1 { border-left: 3px solid #d85a1e; }
        .board-row.rank-2 { border-left: 3px solid #8a7a6a; }
        .board-row.rank-3 { border-left: 3px solid #5a4a3a; }

        .rank {
            font-size: 22px;
            font-weight: 900;
            color: #333;
            text-align: center;
        }
        .rank-1 .rank { color: #d85a1e; font-size: 26px; }
        .rank-2 .rank { color: #8a7a6a; }
        .rank-3 .rank { color: #5a4a3a; }

        .player-name {
            font-size: 18px;
            font-weight: 700;
            color: #d9d2c0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-score {
            font-size: 22px;
            font-weight: 900;
            color: #d85a1e;
            letter-spacing: 1px;
        }

        /* ─── Stany ──────────────────────────────────── */
        .state {
            width: 100%;
            max-width: 480px;
            padding: 40px 0;
            text-align: center;
            color: #555;
            font-size: 16px;
            letter-spacing: 1px;
        }

        .state.error { color: #c04040; }

        /* ─── Loader ─────────────────────────────────── */
        .loader {
            display: inline-block;
            width: 32px; height: 32px;
            border: 3px solid #222;
            border-top-color: #d85a1e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Odświeżanie ────────────────────────────── */
        .refresh-btn {
            margin-top: 32px;
            padding: 12px 28px;
            background: transparent;
            border: 2px solid #d85a1e;
            color: #d85a1e;
            font-family: inherit;
            font-variation-settings: "wght" 700, "SCOP" 0;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s, color 0.15s;
        }
        .refresh-btn:hover { background: #d85a1e; color: #08080a; }

        footer {
            margin-top: 48px;
            font-size: 12px;
            color: #333;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>FLAPPY BOGUŚ 2</h1>
    <p>66. KALISKIE SPOTKANIA TEATRALNE</p>
</header>

<div class="board" id="board"></div>
<button class="refresh-btn" id="refresh-btn">↻ ODŚWIEŻ</button>

<footer>Wyniki aktualizowane na żywo</footer>

<script>
const SUPA_URL = 'https://nkfctpnuqgpqvsgvmdlc.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rZmN0cG51cWdwcXZzZ3ZtZGxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTkxNzksImV4cCI6MjA5NDIzNTE3OX0.f8ZPV4QzR90kXRJlImf0C7i5wR_JFWXA_sFxxGNjqps';

const board = document.getElementById('board');

function showLoading() {
    board.innerHTML = `
        <div class="state">
            <div class="loader"></div><br>Ładowanie wyników...
        </div>`;
}

function showError() {
    board.innerHTML = `
        <div class="state error">
            Nie udało się pobrać wyników.<br>Sprawdź połączenie i spróbuj ponownie.
        </div>`;
}

function showEmpty() {
    board.innerHTML = `
        <div class="state">
            Brak wyników. Bądź pierwszy!
        </div>`;
}

const medals = ['🥇', '🥈', '🥉'];

function renderScores(data) {
    if (!data || data.length === 0) { showEmpty(); return; }

    board.innerHTML = data.map((row, i) => {
        const rankClass = i < 3 ? ` rank-${i + 1}` : '';
        const rankLabel = i < 3 ? medals[i] : `${i + 1}.`;
        return `
        <div class="board-row${rankClass}">
            <span class="rank">${rankLabel}</span>
            <span class="player-name">${escapeHtml(row.name)}</span>
            <span class="player-score">${row.score}</span>
        </div>`;
    }).join('');
}

function escapeHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

async function fetchScores() {
    showLoading();
    try {
        const res = await fetch(
            `${SUPA_URL}/rest/v1/scores?select=name,score&order=score.desc&limit=20`,
            {
                headers: {
                    'apikey': SUPA_KEY,
                    'Authorization': `Bearer ${SUPA_KEY}`
                }
            }
        );
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        renderScores(data);
    } catch (e) {
        showError();
    }
}

document.getElementById('refresh-btn').addEventListener('click', fetchScores);

// Załaduj od razu
fetchScores();

// Auto-odświeżanie co 30 sekund
setInterval(fetchScores, 30000);
</script>
</body>
</html>
